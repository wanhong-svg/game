name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - fix/data-integrity-validation

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -v
