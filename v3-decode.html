<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>v3 加解密</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #1a1a1a;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 600;
    }
    p {
      margin: 0 0 20px;
      color: #596980;
      font-size: 14px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      min-height: 160px;
      padding: 12px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      background: #fff;
    }
    button {
      margin-top: 12px;
      height: 40px;
      padding: 0 20px;
      border: 0;
      border-radius: 8px;
      background: #1a81ff;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #d0d7de;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      line-height: 1.6;
      min-height: 80px;
    }
    .result.error {
      color: #c2410c;
      background: #fff7ed;
      border-color: #fdba74;
    }
    section + section {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <main>
    <h1>v3 加解密</h1>
    <p>明文走 gzip 再转 base64。密文按同样方式解压后展示。</p>
    <section>
      <label for="plain">加密</label>
      <textarea id="plain" placeholder="输入 JSON 或明文"></textarea>
      <button id="encode" type="button">加密</button>
      <div id="encoded" class="result">加密结果会显示在这里</div>
    </section>
    <section>
      <label for="input">解码</label>
      <textarea id="input" placeholder="粘贴 H4sI... 开头的内容"></textarea>
      <button id="decode" type="button">解码</button>
      <div id="output" class="result">解码结果会显示在这里</div>
    </section>
  </main>
  <script>
    const plain = document.getElementById('plain');
    const encoded = document.getElementById('encoded');
    const encodeButton = document.getElementById('encode');
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const button = document.getElementById('decode');

    function toBase64(bytes) {
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    async function zipV3(raw) {
      const text = raw.trim();
      if (!text) {
        throw new Error('请先输入要加密的内容');
      }
      let payload = text;
      try {
        payload = JSON.stringify(JSON.parse(text));
      } catch (_error) {
        payload = text;
      }
      const stream = new Blob([new TextEncoder().encode(payload)])
        .stream()
        .pipeThrough(new CompressionStream('gzip'));
      const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
      return toBase64(bytes);
    }

    async function unzipV3(raw) {
      const b64 = raw.replace(/\s+/g, '');
      if (!b64) {
        throw new Error('请先输入文案');
      }
      const binary = atob(b64);
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const text = await new Response(stream).text();
      let decoded = text;
      try {
        decoded = decodeURIComponent(text);
      } catch (_error) {
        decoded = text;
      }
      try {
        return JSON.stringify(JSON.parse(decoded), null, 2);
      } catch (_error) {
        return decoded;
      }
    }

    encodeButton.addEventListener('click', async () => {
      encodeButton.disabled = true;
      encoded.classList.remove('error');
      encoded.textContent = '加密中…';
      try {
        encoded.textContent = await zipV3(plain.value);
      } catch (error) {
        encoded.classList.add('error');
        encoded.textContent = error && error.message ? error.message : '加密失败';
      } finally {
        encodeButton.disabled = false;
      }
    });

    button.addEventListener('click', async () => {
      button.disabled = true;
      output.classList.remove('error');
      output.textContent = '解码中…';
      try {
        output.textContent = await unzipV3(input.value);
      } catch (error) {
        output.classList.add('error');
        output.textContent = error && error.message ? error.message : '解码失败';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
